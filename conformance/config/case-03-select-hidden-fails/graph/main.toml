# FEATURE_A selects FEATURE_B, but FEATURE_B is hidden (its depends_on GATE
# is off). Forcing a hidden option is the loud E_SELECT_HIDDEN error.
[option.GATE]
type = "bool"
default = false

[option.FEATURE_A]
type = "bool"
default = false
select = ["FEATURE_B"]

[option.FEATURE_B]
type = "bool"
default = false
depends_on = "GATE"
